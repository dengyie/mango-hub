name: Agent Image

# 容器型节点（Render / Railway / Botkeep / QwenPaw / Cloady / Muse-VM）跑的是
# ghcr 镜像，二进制自更新在容器里被 `/.mango-agent-container` 标记跳过，所以
# 这些节点只能靠换镜像升级。原发布源仓 dengyie/vps-monitor 已删除，镜像通道
# 断了；本 workflow 把通道重建在 monorepo 内：push main 即发布
# ghcr.io/dengyie/mangohub-agent:snapshot，节点侧改镜像名即可。
on:
  push:
    branches: [ "main" ]
    paths:
      - "agent/**"
      - ".github/workflows/agent-image.yml"
  workflow_dispatch:

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mangohub-agent

jobs:
  publish:
    name: Build & Publish Agent Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 版本号取自 tag 必须要有完整历史与 tags
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.sum

      - name: Resolve agent version
        id: ver
        run: |
          if tag=$(git describe --tags --exact-match --match 'Snapshot-*' HEAD 2>/dev/null); then
            version="$tag"
          else
            version="Snapshot-$(date -u +%y%m%d%H%M)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Agent version: $version"

      # 与 deploy.yml 一致：CGO 关闭、静态、trimpath；版本注入 update.CurrentVersion，
      # 这样容器节点的 clients.version 能直接看出镜像对应的构建。
      - name: Build linux binaries
        working-directory: agent
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/dengyie/mangohub/agent/update.CurrentVersion=${VERSION}" \
              -o "mangohub-agent-linux-${arch}" .
          done
          ls -lh mangohub-agent-linux-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile 只 COPY 预编译二进制，多架构不需要 QEMU。
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: agent
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:snapshot
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:snapshot-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      # 冒烟：镜像必须能起来并打印用法，否则容器节点拉下去就是一轮全掉线。
      - name: Smoke test image
        run: |
          docker run --rm "${{ env.IMAGE }}:snapshot-${GITHUB_SHA}" --help | head -20

      # 新包默认 private，容器平台没有 registry 凭据就拉不动。GITHUB_TOKEN 通常
      # 无权改用户级包的可见性，失败只告警，需在 Packages 页面手动设为 public。
      - name: Make package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "/user/packages/container/mangohub-agent" \
            -f visibility=public \
            || echo "::warning::Set package visibility to public manually: Packages → mangohub-agent → Package settings"
