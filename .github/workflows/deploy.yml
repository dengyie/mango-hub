name: Mangohub CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  agent-check:
    name: Agent Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.sum

      - name: Run go vet on Agent
        run: |
          cd agent
          go vet ./...

      - name: Build Agent
        run: |
          cd agent
          CGO_ENABLED=0 go build -trimpath -o ../bin/mangohub-agent .

      # Windows 专用文件（//go:build windows）在 linux 上既不编译也不跑测试，
      # 之前 gpu_windows.go 的改动只能靠本地手动验证。这里补一次交叉编译 + vet，
      # 至少保证 windows-only 代码能编过、能通过类型检查。
      - name: Cross-check Agent for Windows
        run: |
          cd agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

      - name: Run Agent Tests
        run: |
          cd agent
          go test -v $(go list ./... | grep -v '/server')
          # /server 整包在 CI 上不可跑（ICMP 原始套接字等环境依赖测试会挂），
          # 但 WebSocket 重连接线测试只依赖本地监听，按名白名单补跑。
          go test -v -run 'TestEstablishWebSocketConnection' ./server/

  hub-check:
    name: Hub Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: hub/go.sum

      - name: Run go vet on Hub
        run: |
          cd hub
          go vet ./...

      - name: Build Hub
        run: |
          cd hub
          CGO_ENABLED=1 go build -trimpath -o ../bin/mangohub .

      - name: Run Hub Tests
        run: |
          cd hub
          go test -v ./...

  deploy-vps:
    name: Deploy to Azure HK VPS
    needs: [agent-check, hub-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HK_HOST }}
          port: ${{ secrets.HK_PORT }}
          username: ${{ secrets.HK_USER }}
          key: ${{ secrets.HK_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            echo "=== [1/6] Syncing code on VPS ==="
            cd /home/mango/mangohub
            git fetch origin main
            git reset --hard origin/main

            echo "=== [2/6] Compiling binary in container ==="
            mkdir -p /home/mango/mangohub/bin
            # 注入构建 hash：/api/version 与启动日志可定位线上对应的 commit。
            BUILD_SHA=$(git -C /home/mango/mangohub rev-parse --short=7 HEAD)
            echo "Building commit $BUILD_SHA"
            # This VPS has 891MB RAM and runs the production hub. An unbounded
            # go build (default GOMAXPROCS, parallel compile of CGO/sqlite) pushes
            # the whole box into swap thrash and can stall the hub for minutes.
            # Cap the build container's resident set: 350m RSS keeps the box
            # responsive, 1g swap lets the CGO compile survive (350m alone OOM-kills
            # cc1 inside sqlite) — a one-shot CI build can afford to be slow.
            sudo docker run --rm \
              --memory 350m --memory-swap 1g \
              -e GOMAXPROCS=1 \
              -v /home/mango/mangohub:/src \
              -w /src/hub \
              -e CGO_ENABLED=1 \
              golang:alpine \
              sh -c "apk add --no-cache gcc musl-dev && go build -p 1 -ldflags '-s -w -linkmode external -extldflags \"-static\" -X github.com/dengyie/mangohub/hub/utils.VersionHash=$BUILD_SHA' -trimpath -o /src/bin/mangohub ."

            echo "=== [3/6] Building production docker image ==="
            sudo docker build -t mangohub:latest -f Dockerfile .

            echo "=== [4/6] Rolling update container ==="
            sudo docker stop komari || true
            sudo docker rm komari || true
            sudo docker run -d \
              --name komari \
              --restart unless-stopped \
              --memory 400m --memory-swap 400m \
              --log-opt max-size=10m \
              --log-opt max-file=5 \
              -p 127.0.0.1:25774:25774 \
              -v /home/mango/komari/data:/app/data \
              --env-file /home/mango/komari/vault.env \
              # Trust exactly the docker gateway so the auth-fail limiter keys
              # buckets on the real client IP (CF-Connecting-IP / X-Real-IP from
              # nginx). Without this every external request collapses into one
              # 172.17.0.1 bucket and a single 401 burst 429s the whole fleet
              # plus the admin API for 15 minutes. Keep in sync with vault.env.
              -e MANGOHUB_TRUSTED_PROXIES=172.17.0.1/32 \
              mangohub:latest

            echo "=== [5/6] Self-health check ==="
            healthy=false
            for i in $(seq 1 30); do
              sleep 1
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:25774/api/public || true)
              if [ "$code" = "200" ]; then
                echo "Container is healthy (HTTP 200) after ${i}s"
                healthy=true
                break
              fi
              echo "Waiting for service to start ($i/30)... HTTP code: $code"
            done

            if [ "$healthy" != "true" ]; then
              echo "Health check failed! Showing container logs:"
              sudo docker logs --tail 50 komari
              exit 1
            fi

            echo "=== [6/6] Deployment completed successfully! ==="
