name: Build frontend theme
description: Build the default (komari-web) and vendored deer themes, and optionally upload them as an artifact.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "23"
  repository:
    description: komari-web repository URL.
    default: https://github.com/komari-monitor/komari-web
  ref:
    description: Optional komari-web ref to build. Uses the repository default branch when empty.
    default: ""
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Clone and build frontend
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf komari-web
        if [ -n "${{ inputs.ref }}" ]; then
          git clone --depth=1 --branch "${{ inputs.ref }}" "${{ inputs.repository }}" komari-web
        else
          git clone --depth=1 "${{ inputs.repository }}" komari-web
        fi
        cd komari-web
        npm install
        npm run build
        cd ..

        mkdir -p web/public/defaultTheme/dist
        rm -rf web/public/defaultTheme/dist/*
        cp -r komari-web/dist/* web/public/defaultTheme/dist/
        cp -f komari-web/komari-theme.json web/public/defaultTheme/
        if [ -f komari-web/preview.png ]; then cp -f komari-web/preview.png web/public/defaultTheme/; fi
        if [ -f komari-web/perview.png ]; then cp -f komari-web/perview.png web/public/defaultTheme/; fi
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - name: Build vendored deer theme
      shell: bash
      run: |
        set -euxo pipefail
        if [ -f web/theme/komari-deer/package.json ]; then
          (
            cd web/theme/komari-deer
            npm ci
            npm run build
          )
          mkdir -p web/public/deerTheme/dist
          rm -rf web/public/deerTheme/dist/*
          cp -r web/theme/komari-deer/dist/* web/public/deerTheme/dist/
          cp -f web/theme/komari-deer/komari-theme.json web/public/deerTheme/
          if [ -f web/theme/komari-deer/preview.png ]; then cp -f web/theme/komari-deer/preview.png web/public/deerTheme/; fi
        else
          echo "No vendored deer theme found; skipping deer build"
        fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public defaultTheme deerTheme

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
